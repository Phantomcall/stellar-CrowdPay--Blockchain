<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Widget</title>
    <style>
      /* Fallback design tokens so the embed renders correctly even before the
         bundled stylesheet (src/index.css) has loaded. src/embed.jsx imports
         ./index.css, but the fallbacks guarantee the CTA is never invisible. */
      :root {
        --color-bg: #ffffff;
        --color-surface: #f5f5f5;
        --color-text-primary: #111111;
        --color-text-secondary: #555555;
        --color-text-hint: #666666;
        --color-text-muted: #888888;
        --color-border: #e0e0e0;
        --color-border-light: #e5e5e5;
        --color-border-lighter: #eee;
        --color-accent: #7c3aed;
        --color-accent-light: #c4b5fd;
        --color-accent-lighter: #ede9fe;
        --color-accent-lightest: #f5f3ff;
        --color-accent-muted: #ede9fe;
        --color-success-bg: #ecfdf5;
        --color-success-border: #a7f3d0;
        --color-success-text: #065f46;
        --color-error-bg: #fef2f2;
        --color-error-border: #fecaca;
        --color-error-text: #991b1b;
        --color-status-error: #dc2626;
        --color-info-bg: #eff6ff;
        --color-info-border: #bfdbfe;
        --color-info-text: #1e40af;
        --color-warning-bg: #fffbeb;
        --color-warning-border: #fcd34d;
        --color-warning-text: #92400e;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/embed.jsx"></script>
  </body>
</html>
